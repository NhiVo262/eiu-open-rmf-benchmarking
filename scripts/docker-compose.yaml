  services:
    openRMF-Benchmarking:
      build:
        context: .
        args:
          USER_UID: ${UID:-1000}
          USER_GID: ${GID:-1000}
      image: eiu-artc/open-rmf:jazzy-20260622
      tty: true
      container_name: open-rmf
      network_mode: host
      volumes:
        - ${HOME}/eiu_ws:/home/eiu/rmf_ws/
        - /tmp/.X11-unix:/tmp/.X11-unix

      environment:
        - ENV=development
        - DEBUG=""
        - DISPLAY=${DISPLAY}
        - QT_X11_NO_MITSHM=1
        - QT_XCB_GL_INTEGRATION=xcb_glx
        - TURTLEBOT3_MODEL=burger
        - ROS_DOMAIN_ID=4 
        - CYCLONEDDS_URI=file:///home/eiu/rmf_ws/src/scripts/cyclonedds_ros.xml
        - NVIDIA_VISIBLE_DEVICES=all
        - NVIDIA_DRIVER_CAPABILITIES=all

      devices:
        - /dev/dri:/dev/dri
      runtime: nvidia

      group_add:
        - video
        - "${RENDER_GID:-110}"

      privileged: true

    openRMF-vda5050:
      build:
        context: .
        args:
          USER_UID: ${UID:-1000}
          USER_GID: ${GID:-1000}
      image: eiu-artc/open-rmf:jazzy-20260622
      tty: true 
      container_name: vda5050
      network_mode: host

      volumes:
        - ${HOME}/eiu_ws:/home/eiu/rmf_ws/
        - /tmp/.X11-unix:/tmp/.X11-unix:rw
        - /usr/lib/x86_64-linux-gnu/dri:/usr/lib/x86_64-linux-gnu/dri
      environment:
        - ENV=development
        - DEBUG=""
        - DISPLAY=${DISPLAY}
        - QT_X11_NO_MITSHM=1
        - TURTLEBOT3_MODEL=burger
        - ROS_DOMAIN_ID=2

      privileged: true
      